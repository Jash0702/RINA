<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Rtwo Corporate Blue Background Gradient -->
    <linearGradient id="rtwoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0060ab" />
      <stop offset="100%" stop-color="#0077c8" />
    </linearGradient>

    <!-- Light Cyan Pulse Wave Glow -->
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Blue Rounded Square Container -->
  <rect width="64" height="64" rx="10" fill="url(#rtwoBg)" />

  <!-- Pulse Wave Leading into R (Light Cyan / Sky Blue) -->
  <!-- Starts from left edge, rises with ECG pulse, and connects directly into the center spine of the R -->
  <path
    d="M 0 31.5 L 10 31.5 Q 13 31.5 15.5 22.5 Q 18 13.5 21 21 Q 23.5 27 26 31.5 L 34 31.5"
    fill="none"
    stroke="#67d1fc"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#pulseGlow)"
  />

  <!-- Bold Crisp White R Letter -->
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M 23 8 L 43.5 8 C 53 8 59 13.5 59 22 C 59 28.5 54.5 33.5 47 35.5 L 57.5 55 L 47 55 L 37.8 37.5 L 33 37.5 L 33 55 L 23 55 Z M 33 17.5 L 33 28.5 L 42.5 28.5 C 46.5 28.5 49 26.5 49 23 C 49 19.5 46.5 17.5 42.5 17.5 Z"
    fill="#FFFFFF"
  />
</svg>
